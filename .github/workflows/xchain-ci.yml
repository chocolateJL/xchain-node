# XCHAIN CI: build the node, run the post-quantum tests and the full unit suite, and fuzz the post-quantum code.
# Runs on pushes and pull requests to xchain/* branches. The full functional suite (about 200 tests) only runs when
# started by hand (Actions -> xchain-ci -> Run workflow -> full_functional), to save private-repo minutes.
name: xchain-ci

on:
  push:
    branches: ['xchain/**']
  pull_request:
    branches: ['xchain/**']
  workflow_dispatch:
    inputs:
      full_functional:
        description: 'Also run the full functional test suite'
        type: boolean
        default: false
      fuzz_seconds:
        description: 'Seconds to run each fuzz target'
        type: number
        default: 120

concurrency:
  group: xchain-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config python3 ccache \
            libboost-chrono-dev libboost-filesystem-dev libboost-test-dev libboost-thread-dev \
            libevent-dev libssl-dev libzmq3-dev libgmp-dev zlib1g-dev

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-

      - name: Configure
        run: >
          cmake -S . -B build -GNinja -DCMAKE_BUILD_TYPE=Release
          -DBUILD_BITCOIN_WALLET=OFF -DBUILD_BITCOIN_QT=OFF
          -DENABLE_UPNP=OFF -DENABLE_NATPMP=OFF -DENABLE_MAN=OFF
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: ninja -C build test_bitcoin bitcoind bitcoin-cli bitcoin-tx mldsa44_testshared

      - name: Compiler cache statistics
        run: ccache --show-stats

      - name: Post-quantum unit tests
        run: build/src/test/test_bitcoin --run_test=pqsig_tests --log_level=test_suite --color_output=no

      - name: Full unit test suite
        run: build/src/test/test_bitcoin --color_output=no

      - name: Post-quantum functional tests
        run: |
          python3 test/functional/feature_pqsig.py --configfile=build/test/config.ini --tmpdir="$RUNNER_TEMP/ft_pqsig"
          python3 test/functional/feature_pqsig_reorg.py --configfile=build/test/config.ini --tmpdir="$RUNNER_TEMP/ft_reorg"

      - name: Full functional test suite
        if: github.event_name == 'workflow_dispatch' && inputs.full_functional
        run: |
          sudo apt-get install -y --no-install-recommends python3-scipy
          # CMake only creates this link when building check-functional; the runner finds config.ini next to it.
          mkdir -p build/test/functional
          ln -sf ../../../test/functional/test_runner.py build/test/functional/test_runner.py
          python3 build/test/functional/test_runner.py -j4 --tmpdirprefix="$RUNNER_TEMP/ft_all"

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            ${{ runner.temp }}/ft_*/**/*.log
          if-no-files-found: ignore
          retention-days: 7

  # libFuzzer with address and undefined-behaviour sanitizers. Replays the seed corpus in test/fuzz/xchain-corpus,
  # then fuzzes each target for a fixed time. New corpus entries are kept in the Actions cache between runs.
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G
      CCACHE_COMPRESS: 'true'
      FUZZ_SECONDS: ${{ inputs.fuzz_seconds || 120 }}
      TARGETS: pqsig_encoding pqsig_verify pqsig_script script_flags transaction_deserialize
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang llvm cmake ninja-build pkg-config python3 ccache \
            libboost-chrono-dev libboost-filesystem-dev libboost-test-dev libboost-thread-dev \
            libevent-dev libssl-dev libgmp-dev zlib1g-dev

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-fuzz-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-fuzz-${{ runner.os }}-

      - name: Restore fuzz corpus
        uses: actions/cache@v4
        with:
          path: fuzz-corpus
          key: fuzz-corpus-${{ github.sha }}
          restore-keys: fuzz-corpus-

      - name: Configure
        run: >
          cmake -S . -B build-fuzz -GNinja
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DENABLE_SANITIZERS="fuzzer;address;undefined"
          -DBUILD_BITCOIN_WALLET=OFF -DBUILD_BITCOIN_QT=OFF -DBUILD_BITCOIN_ZMQ=OFF -DBUILD_BITCOIN_SEEDER=OFF
          -DENABLE_UPNP=OFF -DENABLE_NATPMP=OFF -DENABLE_MAN=OFF -DBUILD_LIBBITCOINCONSENSUS=OFF
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: ninja -C build-fuzz $(printf 'fuzz-%s ' $TARGETS)

      - name: Fuzz
        run: |
          export UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1
          mkdir -p fuzz-crashes
          for t in $TARGETS; do
            mkdir -p fuzz-corpus/$t
            seeds=test/fuzz/xchain-corpus/$t
            [ -d "$seeds" ] || seeds=
            echo "::group::$t ($FUZZ_SECONDS s)"
            build-fuzz/src/test/fuzz/$t -max_total_time=$FUZZ_SECONDS -max_len=20000 -print_final_stats=1 \
              -artifact_prefix=fuzz-crashes/$t- fuzz-corpus/$t $seeds
            echo "::endgroup::"
          done

      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: fuzz-crashes
          if-no-files-found: ignore
          retention-days: 30
