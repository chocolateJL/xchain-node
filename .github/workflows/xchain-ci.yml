# XCHAIN CI: build the node, run the post-quantum tests and the full unit suite.
# Runs on pushes and pull requests to xchain/* branches. The full functional suite (about 200 tests) only runs when
# started by hand (Actions -> xchain-ci -> Run workflow -> full_functional), to save private-repo minutes.
name: xchain-ci

on:
  push:
    branches: ['xchain/**']
  pull_request:
    branches: ['xchain/**']
  workflow_dispatch:
    inputs:
      full_functional:
        description: 'Also run the full functional test suite'
        type: boolean
        default: false

concurrency:
  group: xchain-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config python3 ccache \
            libboost-chrono-dev libboost-filesystem-dev libboost-test-dev libboost-thread-dev \
            libevent-dev libssl-dev libzmq3-dev libgmp-dev zlib1g-dev

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-

      - name: Configure
        run: >
          cmake -S . -B build -GNinja -DCMAKE_BUILD_TYPE=Release
          -DBUILD_BITCOIN_WALLET=OFF -DBUILD_BITCOIN_QT=OFF
          -DENABLE_UPNP=OFF -DENABLE_NATPMP=OFF -DENABLE_MAN=OFF
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: ninja -C build test_bitcoin bitcoind bitcoin-cli bitcoin-tx mldsa44_testshared

      - name: Compiler cache statistics
        run: ccache --show-stats

      - name: Post-quantum unit tests
        run: build/src/test/test_bitcoin --run_test=pqsig_tests --log_level=test_suite --color_output=no

      - name: Full unit test suite
        run: build/src/test/test_bitcoin --color_output=no

      - name: Post-quantum functional tests
        run: |
          python3 test/functional/feature_pqsig.py --configfile=build/test/config.ini --tmpdir="$RUNNER_TEMP/ft_pqsig"
          python3 test/functional/feature_pqsig_reorg.py --configfile=build/test/config.ini --tmpdir="$RUNNER_TEMP/ft_reorg"

      - name: Full functional test suite
        if: github.event_name == 'workflow_dispatch' && inputs.full_functional
        run: |
          sudo apt-get install -y --no-install-recommends python3-scipy
          # CMake only creates this link when building check-functional; the runner finds config.ini next to it.
          mkdir -p build/test/functional
          ln -sf ../../../test/functional/test_runner.py build/test/functional/test_runner.py
          python3 build/test/functional/test_runner.py -j4 --tmpdirprefix="$RUNNER_TEMP/ft_all"

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            ${{ runner.temp }}/ft_*/**/*.log
          if-no-files-found: ignore
          retention-days: 7
